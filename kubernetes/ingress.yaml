apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: age-app-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: age-app.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: age-app
            port:
              number: 80